[project]
name = "local-coding-agent"
version = "0.1.0"
description = "Cursor cloud brain + local Qwen executor"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typesafe-sdk>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
local-agent = "local_agent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["local_agent*", "typesafe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
